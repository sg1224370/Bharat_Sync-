<script>
// Custom Cursor
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx - 6 + 'px';
  cursor.style.top = my - 6 + 'px';
});
(function animRing() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  ring.style.left = rx - 18 + 'px';
  ring.style.top = ry - 18 + 'px';
  requestAnimationFrame(animRing);
})();
document.querySelectorAll('a,button,[data-hover]').forEach(el => {
  el.addEventListener('mouseenter', () => { cursor.classList.add('hovering'); ring.classList.add('hovering'); });
  el.addEventListener('mouseleave', () => { cursor.classList.remove('hovering'); ring.classList.remove('hovering'); });
});

// Neural Network Canvas
(function initNeural() {
  const c = document.getElementById('neural-canvas');
  const ctx = c.getContext('2d');
  let W, H, nodes = [], mouse = {x:0,y:0};
  function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  for (let i = 0; i < 70; i++) {
    nodes.push({x:Math.random()*100,y:Math.random()*100,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,r:Math.random()*1.8+.5});
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    const ns = nodes.map(n => ({...n, px:n.x/100*W, py:n.y/100*H}));
    ns.forEach((a,i) => {
      ns.forEach((b,j) => {
        if (i >= j) return;
        const dx = a.px-b.px, dy = a.py-b.py, d = Math.sqrt(dx*dx+dy*dy);
        if (d < 180) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(99,102,241,${(1-d/180)*.18})`;
          ctx.lineWidth = .5;
          ctx.moveTo(a.px,a.py); ctx.lineTo(b.px,b.py); ctx.stroke();
        }
      });
      // Mouse interaction
      const mdx = a.px - mouse.x, mdy = a.py - mouse.y;
      const md = Math.sqrt(mdx*mdx+mdy*mdy);
      if (md < 150) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(139,92,246,${(1-md/150)*.3})`;
        ctx.lineWidth = .7;
        ctx.moveTo(a.px,a.py); ctx.lineTo(mouse.x,mouse.y); ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(a.px,a.py,a.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(148,163,184,${.3+.2*Math.sin(Date.now()*.001+i)})`;
      ctx.fill();
      nodes[i].x += nodes[i].vx; nodes[i].y += nodes[i].vy;
      if (nodes[i].x < 0 || nodes[i].x > 100) nodes[i].vx *= -1;
      if (nodes[i].y < 0 || nodes[i].y > 100) nodes[i].vy *= -1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const { motion, useScroll, useTransform, animate } = Motion;

// ── Supabase Configuration ──────────────────────────────────
const supabaseUrl = "https://mgofiaeapwaysokirxff.supabase.co";
const supabaseKey = "sb_publishable_ZlPR5T_H9LXRWzrRGja1Pg_C5JyGgYF";
const supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

// ── FadingVideo ─────────────────────────────────────────
const FadingVideo = ({ src, className }) => {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const fadingOut = useRef(false);

  const fadeTo = useCallback((target, dur) => {
    const el = ref.current; if (!el) return;
    cancelAnimationFrame(rafRef.current);
    const start = parseFloat(el.style.opacity || 0);
    const t0 = performance.now();
    const step = now => {
      const p = Math.min((now - t0) / dur, 1);
      el.style.opacity = start + (target - start) * p;
      if (p < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
  }, []);

  useEffect(() => {
    const el = ref.current; if (!el) return;
    const onLoad = () => { el.style.opacity = 0; el.play().catch(()=>{}); fadeTo(1, 1200); };
    const onTime = () => {
      if (!fadingOut.current && el.duration - el.currentTime <= 0.6) {
        fadingOut.current = true; fadeTo(0, 600);
      }
    };
    const onEnd = () => {
      el.style.opacity = 0;
      setTimeout(() => { el.currentTime = 0; el.play().catch(()=>{}); fadingOut.current = false; fadeTo(1, 1200); }, 100);
    };
    el.addEventListener('loadeddata', onLoad);
    el.addEventListener('timeupdate', onTime);
    el.addEventListener('ended', onEnd);
    return () => { cancelAnimationFrame(rafRef.current); el.removeEventListener('loadeddata', onLoad); el.removeEventListener('timeupdate', onTime); el.removeEventListener('ended', onEnd); };
  }, [src, fadeTo]);

  return <video ref={ref} src={src} className={className} style={{opacity:0}} muted playsInline preload="auto" />;
};

// ── Word-by-word blur reveal ─────────────────────────────
const RevealText = ({ text, className, delay = 0 }) => {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const ob = new IntersectionObserver(([e]) => { if(e.isIntersecting) setVis(true); }, {threshold:.1});
    ob.observe(ref.current); return () => ob.disconnect();
  }, []);
  return (
    <p ref={ref} className={className} style={{display:'flex',flexWrap:'wrap',gap:'.12em 0'}}>
      {text.split(' ').map((w, i) => (
        <motion.span key={i} style={{display:'inline-block',marginRight:'.25em'}}
          initial={{filter:'blur(16px)',opacity:0,y:30}}
          animate={vis ? {filter:'blur(0px)',opacity:1,y:0} : {}}
          transition={{duration:.9,delay: delay + i*0.08,ease:[.25,.46,.45,.94]}}>
          {w}
        </motion.span>
      ))}
    </p>
  );
};

// ── Tilt card ─────────────────────────────────────────────
const TiltCard = ({ children, className }) => {
  const ref = useRef(null);
  const handleMove = e => {
    const r = ref.current.getBoundingClientRect();
    const x = e.clientX - r.left - r.width/2;
    const y = e.clientY - r.top - r.height/2;
    ref.current.style.transform = `perspective(800px) rotateY(${x/r.width*12}deg) rotateX(${-y/r.height*12}deg) translateZ(8px)`;
  };
  const handleLeave = () => {
    ref.current.style.transform = 'perspective(800px) rotateY(0) rotateX(0) translateZ(0)';
  };
  return (
    <div ref={ref} className={className} onMouseMove={handleMove} onMouseLeave={handleLeave}
      style={{transition:'transform .3s cubic-bezier(.23,1,.32,1)',transformStyle:'preserve-3d'}}>
      {children}
    </div>
  );
};

// ── Magnetic Button ───────────────────────────────────────
const MagBtn = ({ children, className, onClick }) => {
  const ref = useRef(null);
  const [pos, setPos] = useState({x:0,y:0});
  const move = e => {
    const r = ref.current.getBoundingClientRect();
    setPos({x:(e.clientX-r.left-r.width/2)*.35, y:(e.clientY-r.top-r.height/2)*.35});
    const px = ((e.clientX-r.left)/r.width*100).toFixed(1);
    const py = ((e.clientY-r.top)/r.height*100).toFixed(1);
    ref.current.style.setProperty('--mx', px+'%');
    ref.current.style.setProperty('--my', py+'%');
  };
  const leave = () => setPos({x:0,y:0});
  const click = e => {
    const r = ref.current.getBoundingClientRect();
    const rip = document.createElement('span');
    rip.className = 'ripple';
    rip.style.left = (e.clientX - r.left) + 'px';
    rip.style.top = (e.clientY - r.top) + 'px';
    ref.current.appendChild(rip);
    setTimeout(() => rip.remove(), 700);
    onClick && onClick(e);
  };
  return (
    <motion.button ref={ref} className={className || 'btn-primary'}
      onMouseMove={move} onMouseLeave={leave} onClick={click}
      animate={{x:pos.x, y:pos.y}}
      transition={{type:'spring',stiffness:180,damping:16,mass:.1}}>
      {children}
    </motion.button>
  );
};

// ── Animated Counter ──────────────────────────────────────
const Counter = ({ end, suffix='' }) => {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const ob = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        let s = 0;
        const step = () => { s += end/60; setVal(Math.min(Math.floor(s), end)); if(s<end) requestAnimationFrame(step); };
        requestAnimationFrame(step);
        ob.disconnect();
      }
    }, {threshold:.5});
    ob.observe(ref.current); return () => ob.disconnect();
  }, [end]);
  return <span ref={ref}>{val.toLocaleString()}{suffix}</span>;
};

// ── Navbar ────────────────────────────────────────────────

    isOfficer
      ? { name: 'System Logs', href: '#dashboard' }
      : { name: 'Community', href: '#community' }
  ];
  return (
    <motion.nav className="fixed top-0 left-0 right-0 z-50 flex justify-center pt-5"
      initial={{opacity:0, y:-20}} animate={{opacity:1, y:0}} transition={{duration:.8,delay:.2}}>
      <div className={`glass rounded-full px-6 py-3 flex items-center gap-8 transition-all duration-500 ${scrolled ? 'scale-95' : ''}`} style={{maxWidth:900,width:'90%'}}>
        <div className="flex items-center gap-3 mr-auto cursor-pointer" onClick={() => setView('landing')} data-hover="true">
          <div className="w-8 h-8 rounded-full glass-strong flex items-center justify-center">
            <span className="font-heading font-semibold text-sm">B</span>
          </div>
          <span className="font-heading text-base font-light tracking-wide">BharatSync</span>
        </div>
        <div className="hidden md:flex items-center gap-6">
          {navLinks.map(l => (
            <a key={l.name} href={l.href} className="font-body text-sm font-light text-white/50 hover:text-white transition-colors tracking-wide">{l.name}</a>
          ))}
        </div>
        {user ? (
          <div className="flex items-center gap-4 ml-auto">
            <div className="flex items-center gap-2">
              <div className={`w-2 h-2 rounded-full ${user.role === 'Officer' ? 'bg-indigo-400' : 'bg-amber-400'}`} />
              <span className="font-body text-xs font-light text-white/80">{user.name}</span>
            </div>
            <button 
              onClick={onLogout}
              className="text-[11px] font-mono text-white/35 hover:text-rose-400 transition-colors uppercase tracking-wider cursor-none bg-transparent border-none outline-none"
              data-hover="true"
            >
              Logout
            </button>
          </div>
        ) : (
          <MagBtn onClick={() => setView('login')} className="btn-primary ml-auto text-sm !py-2.5 !px-5 font-light">Launch Portal</MagBtn>
        )}
      </div>
    </motion.nav>

};

// ── Hero ──────────────────────────────────────────────────
const Hero = ({ setView, user }) => {
  const canvasRef = useRef(null);

  useEffect(() => {
    // Three.js Ashoka-style emblem
    const canvas = canvasRef.current;
    if (!canvas || typeof THREE === 'undefined') return;
    const W = canvas.parentElement.clientWidth;
    const H = canvas.parentElement.clientHeight;
    canvas.width = W; canvas.height = H;

    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, W/H, .1, 100);
    camera.position.z = 5;

    // Central glowing orb (Ashoka-like)
    const geom = new THREE.IcosahedronGeometry(1.1, 5);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xb8a47a, metalness:.9, roughness:.1, transparent:true, opacity:.85, wireframe:false
    });
    const emblem = new THREE.Mesh(geom, mat);
    scene.add(emblem);

    // Wireframe overlay
    const wMat = new THREE.MeshBasicMaterial({color:0xd4af6a, wireframe:true, transparent:true, opacity:.15});
    const wire = new THREE.Mesh(geom, wMat);
    scene.add(wire);

    // Rings
    for (let i = 0; i < 3; i++) {
      const rg = new THREE.TorusGeometry(1.7+i*.5, .005+i*.003, 16, 120);
      const rm = new THREE.MeshBasicMaterial({color: i===0?0x6366f1:i===1?0x8b5cf6:0x38bdf8, transparent:true, opacity:.4-i*.1});
      const ring = new THREE.Mesh(rg, rm);
      ring.rotation.x = Math.PI/2 + i*0.4;
      ring.rotation.y = i*0.6;
      scene.add(ring);
    }

    // Particles
    const pGeo = new THREE.BufferGeometry();
    const pCount = 600;
    const pPos = new Float32Array(pCount*3);
    for(let i=0;i<pCount*3;i++) pPos[i]=(Math.random()-.5)*14;
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
    const pMat = new THREE.PointsMaterial({color:0x94a3b8, size:.03, transparent:true, opacity:.6});
    scene.add(new THREE.Points(pGeo, pMat));

    // Lighting
    scene.add(new THREE.AmbientLight(0x334155, 2));
    const pt1 = new THREE.PointLight(0x6366f1, 4, 8); pt1.position.set(3,2,3); scene.add(pt1);
    const pt2 = new THREE.PointLight(0xd4af6a, 3, 6); pt2.position.set(-2,-1,2); scene.add(pt2);
    const pt3 = new THREE.PointLight(0x38bdf8, 2, 5); pt3.position.set(0,3,-2); scene.add(pt3);

    let mx=0, my=0;
    const onMouse = e => { mx=(e.clientX/W-.5)*2; my=-(e.clientY/H-.5)*2; };
    window.addEventListener('mousemove', onMouse);

    let frame;
    const animate = () => {
      frame = requestAnimationFrame(animate);
      const t = Date.now()*0.001;
      emblem.rotation.y = t*.2 + mx*.3;
      emblem.rotation.x = Math.sin(t*.15)*.2 + my*.2;
      wire.rotation.y = emblem.rotation.y;
      wire.rotation.x = emblem.rotation.x;
      emblem.position.y = Math.sin(t*.5)*.12;
      wire.position.y = emblem.position.y;
      pt1.position.x = Math.sin(t*.7)*3;

const GrievanceHub = ({ user, setView, complaints, onComplaintFiled }) => {
  const [activeTab, setActiveTab] = useState('lodge'); // 'lodge' | 'track'
  const [text, setText] = useState('');
  const [dept, setDept] = useState('PWD');
  const [priority, setPriority] = useState('High');
  const [filing, setFiling] = useState(false);
  const [successMsg, setSuccessMsg] = useState('');
  const [searchId, setSearchId] = useState('');
  const [trackedComplaint, setTrackedComplaint] = useState(null);
  const [showVoiceDemo, setShowVoiceDemo] = useState(false);

  const bars = Array.from({length: 20}, (_, i) => i);

  const handleDemoFill = () => {
    setShowVoiceDemo(true);
    setTimeout(() => {
      setText("The streetlights in my area have been broken for 3 days, it's dangerous at night...");
      setDept("PWD");
      setPriority("High");
      setShowVoiceDemo(false);
    }, 2500);
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!text.trim()) return;

    if (!user) {
      setView('login');
      return;
    }

    setFiling(true);
    setSuccessMsg('');

    const newId = `COM-${Math.floor(100 + Math.random() * 900)}`;
    const newComplaint = {
      id: newId,
      title: text,
      dept: dept,
      priority: priority,
      status: 'Pending',
      time: 'Just now'
    };

    setTimeout(async () => {
      let dbSaved = false;
      try {
        if (supabase) {
          const { error } = await supabase.from('complaints').insert([newComplaint]);
          if (!error) dbSaved = true;
        }
      } catch (err) {
        console.error('Error writing to Supabase:', err);
      } finally {
        onComplaintFiled(newComplaint, dbSaved);
        setSuccessMsg(`Complaint successfully filed in database! ID: ${newId}`);
        setText('');
        setFiling(false);
        setSearchId(newId);
        setTrackedComplaint(newComplaint);
        setTimeout(() => {
          setActiveTab('track');
        }, 1000);
      }
    }, 1500);
  };

  const handleSearch = (e) => {
    e?.preventDefault();
    const cleanId = searchId.trim().toUpperCase();
    const found = complaints.find(c => c.id.toUpperCase() === cleanId);
    if (found) {
      setTrackedComplaint(found);
    } else {
      setTrackedComplaint(null);
    }
  };

  useEffect(() => {
    if (searchId) {
      const found = complaints.find(c => c.id.toUpperCase() === searchId.trim().toUpperCase());
      setTrackedComplaint(found || null);
    }
  }, [searchId, complaints]);

          {/* Left Column: Navigation Tabs & Actions */}
          <div className="lg:col-span-4 space-y-6">
            <div className="glass-strong rounded-2xl p-2 flex bg-white/[0.01] border border-white/[0.04]">
              <button 
                onClick={() => setActiveTab('lodge')}
                className={`flex-1 py-3 rounded-xl text-xs font-heading font-light tracking-wider transition-all cursor-none ${
                  activeTab === 'lodge' ? 'bg-white/[0.06] text-white border border-white/[0.08] shadow-lg' : 'text-white/40 hover:text-white/70 bg-transparent border-none'
                }`}
                data-hover="true"
              >
                Lodge Grievance
              </button>
              <button 
                onClick={() => setActiveTab('track')}
                className={`flex-1 py-3 rounded-xl text-xs font-heading font-light tracking-wider transition-all cursor-none ${
                  activeTab === 'track' ? 'bg-white/[0.06] text-white border border-white/[0.08] shadow-lg' : 'text-white/40 hover:text-white/70 bg-transparent border-none'
                }`}

                Track Status

                        <div className="font-body text-xs font-light text-white/70 truncate">{c.title}</div>

                      <span className={`text-[9px] font-mono shrink-0 uppercase px-1.5 py-0.5 rounded ${

                        c.status === 'In Progress' ? 'bg-amber-500/10 text-amber-400' :

                    data-hover="true"
                  >
                    <span>⚡ AI Transcribe Demo</span>

                </div>

                {successMsg && (

                    initial={{ opacity: 0, y: -10 }}
                    animate={{ opacity: 1, y: 0 }}
                    className="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-xl px-4 py-3.5 mb-6 font-body font-light"
                  >
                    {successMsg}

                )}

                {showVoiceDemo ? (

                    <div className="flex items-end gap-1 h-12 mb-6">
                      {bars.map(i => (
                        <motion.div key={i} className="w-1.5 rounded-full bg-indigo-500"
                          animate={{height:[6, Math.random()*36+10, 6]}}

                    </div>
                    <p className="font-heading text-lg italic text-white/60 animate-pulse">

                    <span className="text-[10px] font-mono text-white/20 mt-2">TRANSCRIBING ENGLISH/HINDI AUDIO GRID</span>
                  </div>
                ) : (
                  <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                      <label className="block font-mono text-[10px] text-white/30 uppercase tracking-widest mb-2.5">Grievance Description</label>
                      <textarea

                        placeholder="Describe the issues like pothole reporting, water clogging, sewage leakage..."

                          <option value="Critical" className="bg-[#030508]">Critical</option>

                      </div>

            ) : (
              <motion.div 
                initial={{ opacity: 0, y: 15 }} 
                animate={{ opacity: 1, y: 0 }} 
                className="glass-strong rounded-[2.5rem] p-8 border border-white/[0.05] relative min-h-[400px] flex flex-col"

                {/* Search Bar */}

                      type="text"

                  <button 
                    type="submit"
                    className="btn-primary !rounded-xl !py-3 !px-6 cursor-none bg-transparent border-none"
                    data-hover="true"
                  >
                    Track ID

                {trackedComplaint ? (
                  // Detailed stepper tracking view
                  <div className="space-y-8 flex-1">
                    <div className="glass rounded-2xl p-5 border border-white/[0.03] flex justify-between items-start gap-4">
                      <div>
                        <div className="flex items-center gap-2.5 mb-1.5">

                          <span className="font-body text-xs text-white/40">{trackedComplaint.dept} Department</span>

// ── Login Page ───────────────────────────────────────────
const Login = ({ onLoginSuccess, onBackToHome }) => {
  const [role, setRole] = useState('citizen'); // 'citizen' or 'officer'
  const [phone, setPhone] = useState('');
  const [otp, setOtp] = useState('');
  const [otpSent, setOtpSent] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState(false);
  const [loggedInUser, setLoggedInUser] = useState(null);

  const handleSendOtp = (e) => {
    e.preventDefault();
    if (!phone || phone.length < 10) {
      setError('Please enter a valid 10-digit phone number');
      return;
    }
    setError('');
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      setOtpSent(true);

  };

  const handleVerifyOtp = (e) => {
    e.preventDefault();
    if (otp !== '1234' && otp !== '123456') {
      setError('Invalid OTP. For demo, use 1234');
      return;
    }
    setError('');
    setLoading(true);
    setTimeout(async () => {
      try {
        let loggedUser = null;
        if (supabase) {
          const { data, error } = await supabase
            .from('civic_users')
            .select('*')
            .eq('identifier', phone)
            .eq('role', 'Citizen')
            .maybeSingle();

          if (error) throw error;

          if (data) {
            loggedUser = data;

            const newId = `IND-${Math.floor(1000 + Math.random() * 9000)}-${Math.floor(1000 + Math.random() * 9000)}`;

              id: newId,
              name: `Citizen ${phone.slice(-4)}`,
              role: 'Citizen',
              identifier: phone

            loggedUser = newCitizen;

          // Local fallback
          loggedUser = { name: 'Rahul Sharma', role: 'Citizen', id: 'IND-9082-8812' };
        }

        setSuccess(true);
        setLoggedInUser(loggedUser);
        setTimeout(() => {
          onLoginSuccess(loggedUser);
        }, 1500);
      } catch (err) {
        console.warn("Supabase user auth failed, using mock fallback.", err);

      return;
    }

    setError('');
    setLoading(true);
    setTimeout(async () => {
      try {
        let loggedUser = null;
        if (supabase) {
          const { data, error } = await supabase
            .from('civic_users')
            .select('*')
            .eq('identifier', email)
            .eq('password', password)
            .eq('role', 'Officer')
            .maybeSingle();

          if (data) {
            loggedUser = data;

            setError('Officer credentials not found or incorrect. Try email "officer@gov.in", password "admin"');
            setLoading(false);
            return;
          }

          setLoggedInUser(fallbackUser);

        {/* Decorative corner light */}

        {/* Back navigation */}

          <span className="inline-block transition-transform group-hover:-translate-x-1">←</span> BACK TO HOME

            </div>
            <h3 className="font-heading text-2xl font-light text-white/90 mb-2">Access Granted</h3>
            <p className="font-body font-light text-white/40 text-sm max-w-xs">
              Welcome back, <span className="text-white/80 font-medium">{loggedInUser?.name}</span>. Establishing secure civic session...
            </p>
            <div className="mt-8 flex gap-1 justify-center items-center">
              <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce" style={{ animationDelay: '0s' }} />
              <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-bounce" style={{ animationDelay: '0.15s' }} />

            </div>
          </motion.div>
        ) : (
          // Login Form view
          <>
            {/* Header */}
            <div className="mb-8">
              <div className="flex items-center gap-3 mb-3">

                  <span className="font-heading font-semibold text-xs text-indigo-400">B</span>
                </div>
                <span className="section-kicker !tracking-widest">CIVIC GATEWAY</span>
              </div>
              <h2 className="font-heading text-3xl font-light tracking-tight text-white/90">Sign In</h2>
              <p className="font-body font-light text-white/30 text-sm mt-1">Access India's premier AI-driven governance dashboard.</p>
            </div>

            {/* Role Tab Selector */}
            <div className="flex bg-white/[0.02] border border-white/[0.06] rounded-xl p-1 mb-8">
              <button 
                type="button"
                onClick={() => { setRole('citizen'); setError(''); }}
                className={`flex-1 py-2.5 rounded-lg text-xs font-heading font-light tracking-wide transition-all cursor-none ${
                  role === 'citizen' 
                    ? 'bg-white/[0.06] border border-white/[0.08] text-white shadow-lg' 
                    : 'text-white/40 hover:text-white/70 bg-transparent border-none'

                data-hover="true"
              >
                Citizen Portal
              </button>
              <button 
                type="button"
                onClick={() => { setRole('officer'); setError(''); }}
                className={`flex-1 py-2.5 rounded-lg text-xs font-heading font-light tracking-wide transition-all cursor-none ${
                  role === 'officer' 
                    ? 'bg-white/[0.06] border border-white/[0.08] text-white shadow-lg' 
                    : 'text-white/40 hover:text-white/70 bg-transparent border-none'

                Civic Officer

              >
                <svg className="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

            )}

            {/* Forms */}
            {role === 'citizen' ? (
              <form onSubmit={otpSent ? handleVerifyOtp : handleSendOtp} className="space-y-6">
                {!otpSent ? (

// ── App ───────────────────────────────────────────────────
const App = () => {
  const [view, setView] = useState('landing'); // 'landing' | 'login'
  const [user, setUser] = useState(null);
  const [complaints, setComplaints] = useState([]);
  const [resolvedCount, setResolvedCount] = useState(1203);
  const [dbError, setDbError] = useState(false);

  const localMockData = [
    { id: 'COM-402', title: 'Streetlight malfunction on Ward Road', dept: 'PWD', priority: 'High', status: 'Pending', time: '12m ago' },
    { id: 'COM-399', title: 'Water leakage near Sector-4 main line', dept: 'Water Supply', priority: 'Critical', status: 'In Progress', time: '45m ago' },
    { id: 'COM-391', title: 'Pothole reporting near high school crossroad', dept: 'PWD', priority: 'Medium', status: 'Pending', time: '1h ago' }
  ];

  const handleLogin = (userData) => {
    setUser(userData);
    setView('landing'); // Return to landing, logged in
  };

  const handleLogout = () => {
    setUser(null);
    setView('landing');
  };

  const fetchComplaints = async () => {
    if (!supabase) {
      setComplaints(localMockData);
      return;
    }
    try {
      const { data, error } = await supabase
        .from('complaints')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;

      if (data && data.length > 0) {
        const formatted = data.map(item => ({
          id: item.id,
          title: item.title,
          dept: item.dept,
          priority: item.priority,
          status: item.status,
          time: item.time || 'Just now'
        }));
        setComplaints(formatted);
        const resolved = data.filter(c => c.status === 'Resolved').length;
        setResolvedCount(1203 + resolved);
        setDbError(false);
      } else {
        // Seed database if empty
        const { error: seedError } = await supabase.from('complaints').insert(localMockData);
        if (seedError) console.warn('Database seed skipped:', seedError);
        setComplaints(localMockData);
        setDbError(false);
      }
    } catch (err) {
      console.warn('Supabase fetch failed. Setting fallback mock data.', err);
      setDbError(true);
      setComplaints(localMockData);
    }
  };

  const handleResolve = async (id) => {
    setComplaints(prev => prev.map(c => c.id === id ? { ...c, status: 'Resolved' } : c));
    setResolvedCount(prev => prev + 1);

    if (supabase && !dbError) {
      try {
        const { error } = await supabase
          .from('complaints')
          .update({ status: 'Resolved' })
          .eq('id', id);
        if (error) console.error('Supabase update failed:', error);
      } catch (err) {
        console.error('Failed to resolve complaint in database:', err);
      }
    }
  };

  const handleNewComplaint = (newComplaint, dbSaved) => {
    setComplaints(prev => [newComplaint, ...prev]);
  };

  useEffect(() => {
    fetchComplaints();
  }, [view]);

  useEffect(() => {
    const attachCursorEvents = () => {
      const cursor = document.getElementById('cursor');
      const ring = document.getElementById('cursor-ring');
      if (!cursor || !ring) return;
      document.querySelectorAll('a,button,[data-hover],input,select,textarea').forEach(el => {
        el.removeEventListener('mouseenter', el._enterHandler);
        el.removeEventListener('mouseleave', el._leaveHandler);
        
        el._enterHandler = () => { cursor.classList.add('hovering'); ring.classList.add('hovering'); };
        el._leaveHandler = () => { cursor.classList.remove('hovering'); ring.classList.remove('hovering'); };
        
        el.addEventListener('mouseenter', el._enterHandler);
        el.addEventListener('mouseleave', el._leaveHandler);
      });
    };

    attachCursorEvents();
    const t = setTimeout(attachCursorEvents, 300);
    return () => clearTimeout(t);
  }, [view, user, complaints]);

  return (
    <main>
      <Navbar user={user} setView={setView} onLogout={handleLogout} />
      {view === 'login' ? (
        <Login onLoginSuccess={handleLogin} onBackToHome={() => setView('landing')} />
      ) : (
        <>
          <Hero setView={setView} user={user} />
          <Stats />
          <AIEngine />
          <Escalation />
          <LiveMap />
          {user && user.role === 'Officer' ? (
            <Dashboard 
              user={user} 
              setView={setView} 
              complaints={complaints} 
              resolvedCount={resolvedCount} 
              onResolve={handleResolve} 
              dbError={dbError} 
            />
          ) : (
            <GrievanceHub 
              user={user} 
              setView={setView} 
              complaints={complaints}
              onComplaintFiled={handleNewComplaint} 
            />
          )}
          <Community setView={setView} user={user} />
          <Footer />
        </>
      )}
    </main>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
